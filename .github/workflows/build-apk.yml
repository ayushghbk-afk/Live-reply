# Builds the APK on GitHub - no local Android SDK required.
#
# Runs on every push, every pull request and on demand ("Run workflow" in the Actions
# tab). It runs the unit tests, assembles the debug + release APKs, verifies what ended up
# inside them, and uploads everything as downloadable artifacts on the run page.
#
# Signing: when the repository secrets below are set, the release APK (and the debug APK)
# is signed with your release key, so the debug build is no longer a throwaway identity:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD   - see signing/README.md
# Without them, the release APK is published UNSIGNED and the debug APK is signed with a
# freshly generated debug key (which cannot replace an older debug install).
#
# Pushing a tag like v1.0.0 is handled by release-apk.yml, which also attaches the APKs
# to a GitHub Release.
name: Build APK

on:
  push:
    branches: ['**']
    tags-ignore: ['**'] # tags are built and published by release-apk.yml
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch cancels the build that is still running for it.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Assemble the debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK (platform 35, build-tools 35.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only the default branch refills the cache; other refs just read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: 'on-failure'

      - name: Show the SDK that is in use
        run: |-
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Configure the release signing key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |-
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK will be UNSIGNED and the"
            echo "debug APK will be signed with a freshly generated debug key."
            echo "See signing/README.md to sign both with your own release key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # keystore.properties is gitignored; the runner is ephemeral.
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
          echo "Release signing key configured (alias: $KEY_ALIAS)."

      - name: Prepare a debug signing key (only used when no release key is configured)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |-
          set -euo pipefail
          if [ -f keystore.properties ]; then
            echo "A release key is configured, so Gradle signs both build types with it."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using the debug keystore provided by the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh debug keystore for this run."
            echo "NOTE: this debug key is different in every run, so a new debug APK cannot"
            echo "replace an older debug install (Android reports a signature mismatch)."
            echo "Set ANDROID_DEBUG_KEYSTORE_BASE64 (or the release signing secrets) to stop that."
          fi

      - name: Run the unit tests and build the APKs
        id: build
        # --continue lets assembleDebug/assembleRelease finish even if a test fails, so
        # the APKs are always uploaded; the "Fail the job if..." step at the end still
        # turns a test failure into a red build. `tee` keeps the log for the next step.
        continue-on-error: true
        run: |-
          set -o pipefail
          ./gradlew --continue --stacktrace --console=plain \
            testDebugUnitTest \
            assembleDebug \
            assembleRelease 2>&1 | tee gradle-build.log

      - name: Publish the build errors as annotations
        if: steps.build.outcome == 'failure'
        run: |-
          set +e
          set -o pipefail
          if [ ! -f gradle-build.log ]; then
            echo "::error title=No build log::gradle-build.log was not created - see the build step above."
            exit 0
          fi
          {
            grep -n -E "^(e:|w: .*(error|Error)|FAILURE:|\* What went wrong|Execution failed|> Task .*FAILED|Caused by:|Unresolved reference|Could not (resolve|find|download|create|open)|No such (file|property|method)|error: )" gradle-build.log | head -n 300
            echo '----- last 80 lines of the build log -----'
            tail -n 80 gradle-build.log
          } > build-failure.txt
          echo "extracted $(wc -l < build-failure.txt) diagnostic lines"
          # Everything as one annotation first (GitHub keeps only the first 10 error
          # annotations per step, so the complete text has to travel in a single one),
          # then the most useful lines individually for the run page.
          printf '::error title=Full build diagnostics::%s\n' \
            "$(tr -d '\r' < build-failure.txt | head -c 55000 | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            [ "$i" -gt 9 ] && break
            printf '::error title=Gradle failure::%s\n' "$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-1000)"
          done < build-failure.txt
          {
            echo '### Gradle failure output'
            echo ''
            echo '```text'
            head -n 150 build-failure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Collect the APKs
        if: always()
        run: |-
          set -euo pipefail
          mkdir -p dist
          version="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "App version: ${version}"
          for apk in app/build/outputs/apk/*/*.apk; do
            [ -e "$apk" ] || continue
            # app/build/outputs/apk/debug/app-debug.apk -> LiveReply-1.0.1-debug.apk
            # app/build/outputs/apk/release/app-release-unsigned.apk -> ...-release-unsigned.apk
            suffix="$(basename "$apk" .apk)"
            suffix="${suffix#app-}"
            out="dist/LiveReply-${version}-${suffix}.apk"
            cp -f "$apk" "$out"
            echo "collected $out"
          done
          if [ -d dist ] && ls dist/*.apk >/dev/null 2>&1; then
            ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
            ls -lh dist
          else
            echo "::warning title=No APK produced::Gradle did not produce an APK - see the build log above."
          fi

      - name: Verify the APKs and publish the inspection report
        id: verify
        if: always()
        env:
          SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |-
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -n1)"
          cmdline="$sdk/cmdline-tools/latest/bin"
          mkdir -p dist
          report=dist/BUILD-REPORT.txt
          : > "$report"

          shopt -s nullglob
          apks=(app/build/outputs/apk/*/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK was produced, so there is nothing to verify." | tee -a "$report"
            exit 0
          fi

          for apk in "${apks[@]}"; do
            {
              echo "==================================================================="
              echo "APK            : $(basename "$apk")"
              echo "built path     : $apk"
              echo "size           : $(du -h "$apk" | cut -f1) ($(stat -c%s "$apk") bytes)"
              echo "sha256         : $(sha256sum "$apk" | cut -d' ' -f1)"
            } >> "$report"

            echo "--- aapt2 dump badging (identity, sdk levels, permissions) ---" >> "$report"
            if [ -n "$build_tools" ]; then
              "${build_tools}aapt2" dump badging "$apk" 2>&1 \
                | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|uses-permission|uses-implied-permission)" \
                >> "$report" || true
            else
              echo "aapt2 not found" >> "$report"
            fi

            echo "--- merged manifest: components and their exposure ---" >> "$report"
            if [ -x "$cmdline/apkanalyzer" ]; then
              "$cmdline/apkanalyzer" manifest print "$apk" 2>/dev/null >> "$report" || true
            elif [ -n "$build_tools" ]; then
              "${build_tools}aapt2" dump xmltree --file AndroidManifest.xml "$apk" 2>&1 \
                | grep -E "^ *E: (manifest|application|activity|service|receiver|provider|uses-permission|meta-data|queries|property)|^ *A: (android:(name|exported|permission|foregroundServiceType|isAccessibilityTool|debuggable|versionCode|versionName))" \
                >> "$report" || true
            fi

            echo "--- apksigner verify (signature scheme + certificate) ---" >> "$report"
            if [ -n "$build_tools" ]; then
              "${build_tools}apksigner" verify --verbose --print-certs "$apk" 2>&1 >> "$report" || true
            else
              echo "apksigner not found" >> "$report"
            fi
            echo "" >> "$report"
          done

          cat "$report"

          # Guards: the signing state must match the configuration, otherwise the build is
          # lying to the user about what it produced.
          if [ "${SIGNING_CONFIGURED:-false}" = "true" ] && [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::warning title=Release APK is unsigned::A release signing key was configured, but Gradle produced app-release-unsigned.apk - check keystore.properties and the signing secrets."
          fi
          if [ "${SIGNING_CONFIGURED:-false}" != "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::warning title=Signed release APK without secrets::No ANDROID_KEYSTORE_BASE64 secret is set, yet the release build produced a signed APK - check which key it used."
          fi

          # One annotation carries the whole report, so the facts are readable from the
          # run page and from the API without downloading the artifact.
          printf '::notice title=APK inspection report::%s\n' \
            "$(tr -d '\r' < "$report" | head -c 55000 | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
          {
            echo '### APK inspection report'
            echo ''
            echo '```text'
            head -c 50000 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the job summary
        if: always()
        run: |-
          {
            echo "## Live AI Reply - APK build"
            echo ""
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "- Unit tests + APK build: **passed**"
            else
              echo "- Unit tests + APK build: **failed** (see the annotations and the step log)"
            fi
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            if ls dist/*.apk >/dev/null 2>&1; then
              echo "### Artifacts in \`dist/\`"
              echo ""
              echo '| File | Size | SHA-256 |'
              echo '|---|---|---|'
              for f in dist/*.apk; do
                size="$(du -h "$f" | cut -f1)"
                sum="$(sha256sum "$f" | cut -d' ' -f1)"
                echo "| \`$(basename "$f")\` | ${size} | \`${sum:0:16}…\` |"
              done
              echo ""
              echo "Download the **live-ai-reply-apk** artifact at the bottom of this page."
              echo "Install the \`-release.apk\` when one is published (signed, not debuggable);"
              echo "the \`-debug.apk\` is for local testing only."
              echo ""
              echo "Play Protect blocks internet-sideloaded installs of apps that declare"
              echo "accessibility access - see README -> \"Google Play Protect\". Use"
              echo "\`adb install\` for developer installs."
            else
              echo "No APK was produced - check the build log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-ai-reply-apk-${{ github.sha }}
          path: |
            dist/*.apk
            dist/BUILD-REPORT.txt
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
          # APKs are already compressed - don't waste time zipping them again.
          compression-level: 0

      - name: Upload the unit test report and the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job if the build or the tests failed
        if: steps.build.outcome == 'failure'
        run: |-
          echo "::error title=Build or tests failed::See the annotations above, the 'Run the unit tests and build the APKs' step log, or the unit-test-report artifact."
          exit 1
