# Publishes APKs to a GitHub Release.
#
# Trigger it by pushing a version tag:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# ...or by hand from the Actions tab ("Run workflow") and typing the tag to publish.
#
# The release always gets the installable debug APK. The release APK is signed with your
# own key when the signing secrets below are configured, otherwise it is attached
# unsigned so you can sign it yourself:
#
#   ANDROID_KEYSTORE_BASE64    base64 -w0 my-release.keystore
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key alias inside the keystore
#   ANDROID_KEY_PASSWORD       the key password
#   ANDROID_DEBUG_KEYSTORE_BASE64  (optional) a stable debug keystore so the debug APK
#                                  can be updated in place on a phone
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Created from the current ref if it does not exist.'
        required: true
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required to create/update the release

jobs:
  release:
    name: Build and publish the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the tag and the app version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing tag '${tag}' (app version ${version})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK (platform 35, build-tools 35.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using the debug keystore provided by the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh debug keystore."
          fi

      - name: Run the unit tests and build the APKs
        run: |
          ./gradlew --stacktrace --console=plain \
            testDebugUnitTest \
            assembleDebug \
            assembleRelease

      - name: Collect the APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ steps.meta.outputs.version }}"
          for apk in app/build/outputs/apk/*/*.apk; do
            [ -e "$apk" ] || continue
            # app/build/outputs/apk/debug/app-debug.apk -> LiveReply-1.0.0-debug.apk
            suffix="$(basename "$apk" .apk)"
            suffix="${suffix#app-}"
            out="dist/LiveReply-${version}-${suffix}.apk"
            cp -f "$apk" "$out"
            echo "collected $out"
          done
          ls -lh dist

      - name: Sign the release APK (only when the signing secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured - publishing the release APK unsigned."
            echo "See README -> 'Signing a release build' to sign it with your own key."
            exit 0
          fi
          if [ ! -f "$unsigned" ]; then
            echo "::warning title=No unsigned release APK::Nothing to sign."
            exit 0
          fi

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -n1)"
          echo "Using build-tools from ${build_tools}"

          trap 'rm -f keystore.jks aligned.apk' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks

          key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          "${build_tools}zipalign" -p -f 4 "$unsigned" aligned.apk
          "${build_tools}apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${key_password}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "dist/LiveReply-${VERSION}-release.apk" \
            aligned.apk
          "${build_tools}apksigner" verify --print-certs "dist/LiveReply-${VERSION}-release.apk"
          echo "Signed dist/LiveReply-${VERSION}-release.apk"

      - name: Checksums and summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          {
            echo "## Live AI Reply $TAG"
            echo ""
            echo '| File | Size |'
            echo '|---|---|'
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo 'Checksums: `SHA256SUMS.txt` in the release assets.'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading/replacing the assets."
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Live AI Reply ${TAG#v}" \
              --generate-notes \
              dist/*
          fi
          gh release view "$TAG" --repo "$REPO" --json url --jq '"Release: " + .url' >> "$GITHUB_STEP_SUMMARY"
