# Publishes APKs to a GitHub Release.
#
# Trigger it by pushing a version tag:
#
#   git tag v1.0.1
#   git push origin v1.0.1
#
# ...or by hand from the Actions tab ("Run workflow") and typing the tag to publish.
#
# Signing is done by Gradle, with the key from these repository secrets (see
# signing/README.md):
#
#   ANDROID_KEYSTORE_BASE64        base64 -w0 signing/live-reply-release.keystore
#   ANDROID_KEYSTORE_PASSWORD      keystore password
#   ANDROID_KEY_ALIAS              key alias inside the keystore
#   ANDROID_KEY_PASSWORD           key password (defaults to the keystore password)
#   ANDROID_DEBUG_KEYSTORE_BASE64  (optional) a stable debug keystore, used only when no
#                                  release key is configured
#
# With no key configured the release APK is attached UNSIGNED, named
# `...-release-unsigned.apk` so its state is obvious, and the run summary says so.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.1). Created from the current ref if it does not exist.'
        required: true
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required to create/update the release

jobs:
  release:
    name: Build and publish the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Resolve the tag and the app version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |-
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing tag '${tag}' (app version ${version})"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK (platform 35, build-tools 35.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Configure the release signing key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |-
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured - the release APK will be published"
            echo "UNSIGNED as '...-release-unsigned.apk'. See signing/README.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # keystore.properties is gitignored; the runner is ephemeral and the file is
          # never uploaded, so the private key does not leave the machine.
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
          echo "Release signing key configured (alias: $KEY_ALIAS)."

      - name: Prepare a debug signing key (only used when no release key is configured)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |-
          set -euo pipefail
          if [ -f keystore.properties ]; then
            echo "A release key is configured, so Gradle signs both build types with it."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using the debug keystore provided by the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh debug keystore for this run."
          fi

      - name: Run the unit tests and build the APKs
        id: build
        run: |-
          set -o pipefail
          ./gradlew --stacktrace --console=plain \
            testDebugUnitTest \
            assembleDebug \
            assembleRelease 2>&1 | tee gradle-build.log

      - name: Publish the build errors as annotations
        if: failure()
        run: |-
          set +e
          set -o pipefail
          [ -f gradle-build.log ] || exit 0
          {
            grep -n -E "^(e:|w: .*(error|Error)|FAILURE:|\* What went wrong|Execution failed|> Task .*FAILED|Caused by:|Unresolved reference|Could not (resolve|find|download|create|open)|error: )" gradle-build.log | head -n 100
            echo '----- last 40 lines of the build log -----'
            tail -n 40 gradle-build.log
          } > build-failure.txt
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            [ "$i" -gt 30 ] && break
            printf '::error title=Gradle failure::%s\n' "$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-1000)"
          done < build-failure.txt
          exit 0

      - name: Collect the APKs
        run: |-
          set -euo pipefail
          mkdir -p dist
          version="${{ steps.meta.outputs.version }}"
          for apk in app/build/outputs/apk/*/*.apk; do
            [ -e "$apk" ] || continue
            # app/build/outputs/apk/debug/app-debug.apk        -> LiveReply-1.0.1-debug.apk
            # app/build/outputs/apk/release/app-release.apk    -> LiveReply-1.0.1-release.apk
            suffix="$(basename "$apk" .apk)"
            suffix="${suffix#app-}"
            out="dist/LiveReply-${version}-${suffix}.apk"
            cp -f "$apk" "$out"
            echo "collected $out"
          done
          ls -lh dist

      - name: Signing check (fails loudly if a configured key was not used)
        env:
          SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |-
          set -euo pipefail
          if [ "${SIGNING_CONFIGURED:-false}" = "true" ]; then
            if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
              echo "::error title=Unsigned release APK::A release signing key is configured, but Gradle produced app-release-unsigned.apk. The release must not be published unsigned."
              exit 1
            fi
            echo "A configured signing key was used: $(ls dist/*release.apk)"
          else
            echo "::warning title=Release APK is unsigned::No ANDROID_KEYSTORE_BASE64 secret is set. The release APK will be published unsigned; add the secrets in signing/README.md to sign it."
          fi

      - name: Verify the APKs and publish the inspection report
        run: |-
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -n1)"
          cmdline="$sdk/cmdline-tools/latest/bin"
          report=dist/BUILD-REPORT.txt
          : > "$report"
          for apk in dist/*.apk; do
            [ -e "$apk" ] || continue
            {
              echo "==================================================================="
              echo "APK            : $(basename "$apk")"
              echo "size           : $(du -h "$apk" | cut -f1) ($(stat -c%s "$apk") bytes)"
              echo "sha256         : $(sha256sum "$apk" | cut -d' ' -f1)"
              echo "--- aapt2 dump badging (identity, sdk levels, permissions) ---"
              "${build_tools}aapt2" dump badging "$apk" 2>&1 \
                | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|uses-permission|uses-implied-permission)" || true
              echo "--- merged manifest ---"
              if [ -x "$cmdline/apkanalyzer" ]; then
                "$cmdline/apkanalyzer" manifest print "$apk" 2>/dev/null || true
              else
                "${build_tools}aapt2" dump xmltree --file AndroidManifest.xml "$apk" 2>&1 \
                  | grep -E "^ *E: |^ *A: android:(name|exported|permission|foregroundServiceType|versionCode|versionName|debuggable)" || true
              fi
              echo "--- apksigner verify (signature scheme + certificate) ---"
              "${build_tools}apksigner" verify --verbose --print-certs "$apk" 2>&1 || true
              echo ""
            } >> "$report"
          done
          cat "$report"
          printf '::notice title=APK inspection report::%s\n' \
            "$(tr -d '\r' < "$report" | head -c 55000 | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
          {
            echo '### APK inspection report'
            echo ''
            echo '```text'
            head -c 50000 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums and summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |-
          set -euo pipefail
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          {
            echo "## Live AI Reply $TAG"
            echo ""
            echo '| File | Size |'
            echo '|---|---|'
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo 'Checksums: `SHA256SUMS.txt`. A full manifest/permission/signature dump is in'
            echo '`BUILD-REPORT.txt`.'
            echo ""
            if ls dist/*release-unsigned.apk >/dev/null 2>&1; then
              echo "**The release APK is unsigned.** Add the signing secrets (signing/README.md)"
              echo "and re-run this workflow to publish a signed build."
            fi
            echo ""
            echo "Reminder: Play Protect blocks internet-sideloaded installs of apps that declare"
            echo "accessibility access. Install developer builds with \`adb install\` - see README"
            echo "-> \"Google Play Protect\"."
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading/replacing the assets."
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Live AI Reply ${TAG#v}" \
              --generate-notes \
              dist/*
          fi
          gh release view "$TAG" --repo "$REPO" --json url --jq '"Release: " + .url' >> "$GITHUB_STEP_SUMMARY"
